services:
  eurosat-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - eurosat-cache:/root/.cache
    ports:
      - "5173:5173"
      - "8000:8000"
      - "8501:8501"
      - "8888:8888"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: /bin/bash -c "sleep infinity"

volumes:
  eurosat-cache: